<!DOCTYPE html>
<html data-bs-theme="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
        <title>DigiCloud</title>
        <link rel="stylesheet" th:href="@{/assets/bootstrap/css/bootstrap.min.css}" />
        <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Acme&amp;display=swap}" />
        <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Akshar&amp;display=swap}" />
        <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Alata&amp;display=swap}" />
        <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Angkor&amp;display=swap}" />
        <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Anton&amp;display=swap}" />
        <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Arbutus&amp;display=swap}" />
        <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Archivo+Black&amp;display=swap}" />
        <link rel="stylesheet" th:href="@{https://fonts.googleapis.com/css?family=Audiowide&amp;display=swap}" />
        <link rel="stylesheet" th:href="@{/assets/fonts/ionicons.min.css}" />
        <link rel="stylesheet" th:href="@{/assets/css/animate.min.css}" />
        <link rel="stylesheet" th:href="@{/assets/css/Login-Form-Basic-icons.css}" />
        <link rel="stylesheet" th:href="@{/assets/css/styles.css}" />
        <script th:src="@{/assets/js/jquery.min.js}"></script>
        <script th:src="@{/assets/js/bootbox.js}"></script>
        <script th:src="@{/assets/js/utils.js}"></script>
        <script th:src="@{/assets/js/signupForm.js}"></script>
    </head>

    <body style="background: #efeded">
        <section class="position-relative py-4 py-xl-5" style="background: #efeded; width: 100%; height: 100vh; padding-top: 45px; margin-top: 15px">
            <div class="container position-relative">
                <div class="row d-flex justify-content-center">
                    <div class="col-md-8 col-lg-6 col-xl-5 col-xxl-4">
                        <div class="card my-3">
                            <div class="card-body px-5" style="padding-top: 0px; border-color: var(--bs-emphasis-color); margin-top: 13px">
                                <img class="img-fluid rubberBand animated" style="margin-left: 130px" th:src="@{/assets/img/icons8-storage-94.png}" width="60" height="60" />
                                <h4 class="text-center mb-4" style="font-family: Acme, sans-serif">Create a DigiCloud Account</h4>
                                <form id="signupForm">
                                    <div class="mb-3"><input class="form-control input-border-round" type="text" id="fName" name="firstName" placeholder="Name" required="" /></div>
                                    <div class="mb-3"><input class="form-control input-border-round" type="text" id="lName" name="lastName" placeholder="Last Name  (Optional)" /></div>
                                    <div class="mb-3"><input class="form-control input-border-round" type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter Phone Number" required="" /></div>
                                    <div class="mb-3"><input class="form-control input-border-round" type="email" id="email" name="email" placeholder="Email" required="" /></div>
                                    <div class="mb-3"><input class="form-control input-border-round" type="password" id="password" name="password" placeholder="Enter Your Password" /></div>
                                    <div class="mb-3"><input class="form-control input-border-round" type="date" id="dob" name="dob" required="" /></div>
                                    <div class="generate-otp-div"><button class="btn btn-primary w-100" type="button" id="generateOtpButton">Generate Otp</button></div>
                                    <div class="give-otp-div" style="display:none">
                                        <div class="mb-3"><input class="form-control input-border-round" type="text" id="otp" name="otp" placeholder="Otp" required="" /></div>
                                        <div><button class="btn btn-primary w-100" type="button" id="verifyOtpButton">Verify Otp</button></div>
                                    </div>
                                    <div class="d-flex justify-content-center py-2">
                                        <button type="reset" class="btn btn-primary btn-sm"><i class="icon ion-ios-refresh-empty"></i></button>
                                    </div>
                                </form>
                            </div>
                            <div class="d-flex justify-content-around my-3"><a href="welcome-page">Home Page</a><a href="login">Already have an account ? Log In</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <script th:src="@{/assets/bootstrap/js/bootstrap.min.js}"></script>
        <script th:src="@{/assets/js/bs-init.js}"></script>
    </body>
</html>
