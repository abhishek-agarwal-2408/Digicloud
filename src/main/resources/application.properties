spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/cloud-web?useSSL=false&useUnicode=yes&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
otp.expiry.time.minutes=5
baseFolder=D:/repo/cloudServerData/
security.login.page=/control/login
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=1GB

